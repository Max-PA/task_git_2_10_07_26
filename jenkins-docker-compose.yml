# docker-compose.yaml
version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8081:8080 # 8081 - порт Windows, через який звертаюся до Docker Jenkins. 8080 - внутрішній порт контейнера, на якому слухає Jenkins.
      - 50000:50000
    container_name: jenkins
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
    external: true
    name: jenkins_data